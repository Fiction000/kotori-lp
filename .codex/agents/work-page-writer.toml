Return exactly: DRAFT STATUS; SEO FIELDS (canonical, title, description, H1, social fields); PAGE COPY (lead, spoiler-light synopsis, data, reading points, source access, Kotori CTA, related material, supported FAQ); STRUCTURED CONTENT field map; WRITER NOTES.
"""
